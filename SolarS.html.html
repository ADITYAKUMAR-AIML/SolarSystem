<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #00002b, #000000);
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
        }

        .solar-system {
            position: relative;
            width: 600px;
            height: 600px;
        }

        .sun {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ffcc00, #ff8800);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px #ff8800;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate infinite linear;
        }

        .planet {
    position: absolute;
    width: 20px;
    height: 20px;
    background-size: cover; /* Makes the image fit the planet */
    background-position: center; /* Centers the image */
    border-radius: 50%; /* Keeps the planet round */
    top: 50%;
    left: 100%;
    transform: translate(-50%, -50%);
    animation: orbit infinite linear;
}

        /* Individual planets and orbits */
        .orbit.mercury { width: 120px; height: 120px; animation-duration: 5s; }
        .planet.mercury { background-image: url('https://media2.s-nbcnews.com/i/msnbc/Components/Photo_StoryLevel/080114/080114-mercury-hmed-10a.jpg'); animation-duration: 5s; }

        .orbit.venus { width: 180px; height: 180px; animation-duration: 7s; }
        .planet.venus { background: #f5c89b; animation-duration: 7s; }

        .orbit.earth { width: 240px; height: 240px; animation-duration: 10s; }
        .planet.earth { background: #00aaff; animation-duration: 10s; }

        .orbit.mars { width: 300px; height: 300px; animation-duration: 15s; }
        .planet.mars { background: #ff4500; animation-duration: 15s; }

        .orbit.jupiter { width: 380px; height: 380px; animation-duration: 20s; }
        .planet.jupiter { background: #d2b48c; animation-duration: 20s; }

        .orbit.saturn { width: 460px; height: 460px; animation-duration: 25s; }
        .planet.saturn { background: #deb887; animation-duration: 25s; }

        .orbit.uranus { width: 520px; height: 520px; animation-duration: 30s; }
        .planet.uranus { background: #7fffd4; animation-duration: 30s; }

        .orbit.neptune { width: 580px; height: 580px; animation-duration: 35s; }
        .planet.neptune { background: #4169e1; animation-duration: 35s; }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="solar-system">
        <div class="sun"></div>
        <div class="orbit mercury"><div class="planet mercury"></div></div>
        <div class="orbit venus"><div class="planet venus"></div></div>
        <div class="orbit earth"><div class="planet earth"></div></div>
        <div class="orbit mars"><div class="planet mars"></div></div>
        <div class="orbit jupiter"><div class="planet jupiter"></div></div>
        <div class="orbit saturn"><div class="planet saturn"></div></div>
        <div class="orbit uranus"><div class="planet uranus"></div></div>
        <div class="orbit neptune"><div class="planet neptune"></div></div>
    </div>
</body>
</html>
